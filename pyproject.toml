[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mcx-project"
version = "0.1.0"
description = "Provenance-gated dense-array transcranial photon-transport workflow"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "jsonschema>=4.23,<5",
  "numpy>=2.1,<3",
]

[project.optional-dependencies]
cuda = ["pmcx==0.7.1"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
mcx-project = "mcx_project.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcx_project"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
